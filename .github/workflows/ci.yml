name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Typecheck and build
        run: npm run build

  # The native build and the numerical suite are verified on macOS 15 arm64
  # (science/README.md); the numbers depend on the toolchain, so the image is
  # pinned rather than macos-latest. On Linux the library builds and the Node
  # tests pass, but 15 science tests that pass on macOS fail, so Linux stays
  # unsupported until that is investigated rather than masked here.
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: science/pyproject.toml
      - run: npm ci
      - name: Install the science package
        run: |
          python -m venv science/.venv
          science/.venv/bin/python -m pip install -e './science[test]'
      - name: Identify the pinned native source and toolchain image
        id: native
        run: |
          echo "revision=$(git rev-parse HEAD:science/vendor/vocaltractlab)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      # The build script exports the pinned submodule revision, applies the
      # versioned patch and runs the native tests. Those inputs plus the runner
      # image (compiler) determine the library, so a change to any of them
      # rebuilds and retests it; the engine re-checks the library hash at load.
      - name: Restore the native build
        id: native-cache
        uses: actions/cache@v6
        with:
          path: science/.build/native
          key: vtl-${{ runner.arch }}-${{ steps.native.outputs.image }}-${{ steps.native.outputs.revision }}-${{ hashFiles('science/patches/**', 'science/scripts/build_native.py', 'science/tests/anatomy_lifecycle.cpp') }}
      - name: Build and test the native library
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: science/.venv/bin/python science/scripts/build_native.py
      # The media tests decode real encoded audio and video; without these
      # tools they would be skipped and CI would not exercise them.
      - name: Media decoder
        run: if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg; fi
      - name: Node tests
        run: npm test
      - name: Science tests
        run: npm run test:science -- -n auto
      - name: Browser checks
        run: npx playwright test
      # Checks that need the scientific worker run with their own configs, one step each
      # so every config reports its own result and time. Each run clears test-results/
      # and a failed step skips the later ones, so the upload below holds the failed run.
      - name: 'Browser check: spectral objective'
        run: npx playwright test -c tests/spectral-objective.config.ts
      - name: 'Browser check: session recompute'
        run: npx playwright test -c tests/session-recompute.config.ts
      - name: 'Browser check: motion timeline'
        run: npx playwright test -c tests/motion-timeline.config.ts
      - name: 'Browser check: motion audio'
        run: npx playwright test -c tests/motion-audio.config.ts
      - name: 'Browser check: visual likelihood'
        run: npx playwright test -c tests/visual-likelihood.config.ts
      - name: 'Browser check: LiDAR'
        run: npx playwright test -c tests/lidar-runtime.config.ts
      - name: 'Browser check: source bank'
        run: npx playwright test -c tests/source-bank-runtime.config.ts
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
